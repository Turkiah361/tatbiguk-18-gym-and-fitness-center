<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قوة إيليت - مركز اللياقة البدنية | Elite Force Fitness Center</title>
<style>
  :root {
    --primary: #FF6B00;
    --primary-dark: #CC5500;
    --secondary: #1A1A2E;
    --accent: #E94560;
    --gold: #FFD700;
    --dark: #0F0F1A;
    --darker: #080812;
    --light: #F5F5F5;
    --gray: #888;
    --card-bg: #16213E;
    --text: #E8E8E8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--dark);
    color: var(--text);
    overflow-x: hidden;
    direction: rtl;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--darker); }
  ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

  /* ===== NAVIGATION ===== */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(10,10,20,0.95);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,107,0,0.2);
    transition: all 0.3s ease;
  }

  nav.scrolled {
    background: rgba(8,8,18,0.98);
    box-shadow: 0 4px 30px rgba(255,107,0,0.15);
  }

  .nav-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .logo-icon {
    width: 45px;
    height: 45px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 900;
    color: white;
  }

  .logo-text { line-height: 1.1; }
  .logo-text .ar { font-size: 18px; font-weight: 700; color: white; }
  .logo-text .en { font-size: 11px; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; }

  .nav-links {
    display: flex;
    gap: 5px;
    list-style: none;
    align-items: center;
  }

  .nav-links a {
    color: var(--text);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s;
    white-space: nowrap;
  }

  .nav-links a:hover {
    color: var(--primary);
    background: rgba(255,107,0,0.1);
  }

  .nav-cta {
    background: linear-gradient(135deg, var(--primary), var(--accent)) !important;
    color: white !important;
    font-weight: 700 !important;
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(255,107,0,0.4) !important;
    background: linear-gradient(135deg, var(--primary), var(--accent)) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 5px;
  }

  .hamburger span {
    width: 25px;
    height: 2px;
    background: var(--primary);
    border-radius: 2px;
    transition: all 0.3s;
  }

  .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

  .mobile-menu {
    display: none;
    flex-direction: column;
    background: rgba(8,8,18,0.98);
    padding: 20px;
    gap: 5px;
    border-top: 1px solid rgba(255,107,0,0.2);
  }

  .mobile-menu.open { display: flex; }

  .mobile-menu a {
    color: var(--text);
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.3s;
  }

  .mobile-menu a:hover { color: var(--primary); background: rgba(255,107,0,0.1); }

  /* ===== HERO ===== */
  #hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #0F0F1A 0%, #1A0A2E 25%, #2D0A0A 50%, #1A1A0A 75%, #0A1A2E 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    animation: floatParticle linear infinite;
    opacity: 0.3;
  }

  @keyframes floatParticle {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.3; }
    90% { opacity: 0.3; }
    100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
  }

  .hero-bg-text {
    position: absolute;
    font-size: clamp(80px, 15vw, 200px);
    font-weight: 900;
    color: rgba(255,107,0,0.04);
    white-space: nowrap;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    letter-spacing: 10px;
    pointer-events: none;
    animation: bgTextPulse 4s ease-in-out infinite;
  }

  @keyframes bgTextPulse {
    0%, 100% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 0.5; transform: translate(-50%,-50%) scale(1.02); }
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 20px;
    max-width: 900px;
    animation: heroFadeIn 1.2s ease forwards;
  }

  @keyframes heroFadeIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-badge {
    display: inline-block;
    background: rgba(255,107,0,0.15);
    border: 1px solid rgba(255,107,0,0.4);
    color: var(--primary);
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 25px;
    animation: badgePulse 2s ease-in-out infinite;
    letter-spacing: 1px;
  }

  @keyframes badgePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,0,0.4); }
    50% { box-shadow: 0 0 0 10px rgba(255,107,0,0); }
  }

  .hero-title {
    font-size: clamp(40px, 7vw, 85px);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .hero-title .main {
    background: linear-gradient(135deg, #ffffff, #ff6b00, #ffd700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: block;
  }

  .hero-title .sub {
    color: rgba(255,255,255,0.5);
    font-size: 0.45em;
    font-weight: 400;
    letter-spacing: 4px;
    text-transform: uppercase;
    display: block;
    margin-top: 10px;
  }

  .hero-desc {
    font-size: clamp(14px, 2vw, 18px);
    color: rgba(255,255,255,0.7);
    margin: 20px 0 40px;
    line-height: 1.8;
    max-width: 650px;
    margin-inline: auto;
    margin-top: 20px;
    margin-bottom: 40px;
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .hero-stat {
    text-align: center;
    animation: statsFadeIn 1s ease forwards;
    opacity: 0;
  }

  .hero-stat:nth-child(1) { animation-delay: 0.5s; }
  .hero-stat:nth-child(2) { animation-delay: 0.7s; }
  .hero-stat:nth-child(3) { animation-delay: 0.9s; }

  @keyframes statsFadeIn {
    to { opacity: 1; transform: translateY(0); }
    from { opacity: 0; transform: translateY(20px); }
  }

  .stat-number {
    font-size: 36px;
    font-weight: 900;
    color: var(--primary);
    display: block;
    line-height: 1;
  }

  .stat-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 5px; }

  .hero-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    padding: 16px 40px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    transition: all 0.3s;
    border: none;
    cursor: pointer;
    display: inline-block;
    position: relative;
    overflow: hidden;
  }

  .btn-primary::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s;
  }

  .btn-primary:hover::before { left: 100%; }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255,107,0,0.4); }

  .btn-outline {
    background: transparent;
    color: white;
    padding: 16px 40px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    transition: all 0.3s;
    display: inline-block;
  }

  .btn-outline:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-3px);
  }

  .hero-scroll {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    animation: scrollBounce 2s ease-in-out infinite;
  }

  @keyframes scrollBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(10px); }
  }

  .scroll-arrow {
    width: 30px;
    height: 30px;
    border-right: 2px solid var(--primary);
    border-bottom: 2px solid var(--primary);
    transform: rotate(45deg);
    opacity: 0.6;
  }

  /* ===== SECTIONS ===== */
  section { padding: 90px 0; }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .section-header {
    text-align: center;
    margin-bottom: 60px;
  }

  .section-tag {
    display: inline-block;
    background: rgba(255,107,0,0.1);
    border: 1px solid rgba(255,107,0,0.3);
    color: var(--primary);
    padding: 6px 18px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  .section-title {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800;
    color: white;
    margin-bottom: 12px;
    line-height: 1.2;
  }

  .section-title span { color: var(--primary); }

  .section-subtitle {
    font-size: 14px;
    color: var(--gray);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    margin: 15px auto 0;
    border-radius: 2px;
  }

  /* ===== ABOUT ===== */
  #about { background: var(--darker); }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
  }

  .about-visual {
    position: relative;
  }

  .about-img-box {
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 50%, #7B2D8B 100%);
    border-radius: 20px;
    height: 450px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .about-img-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1), transparent);
  }

  .about-icon-big {
    font-size: 120px;
    opacity: 0.3;
    position: absolute;
    bottom: -20px;
    left: -20px;
  }

  .about-center-text {
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .about-center-text h3 {
    font-size: 28px;
    font-weight: 900;
    color: white;
    line-height: 1.2;
  }

  .about-center-text p { color: rgba(255,255,255,0.8); margin-top: 10px; }

  .about-badge {
    position: absolute;
    bottom: -20px;
    right: -20px;
    background: var(--gold);
    color: var(--dark);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    box-shadow: 0 10px 30px rgba(255,215,0,0.3);
    animation: badgeRotate 10s linear infinite;
  }

  @keyframes badgeRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .about-badge span:first-child { font-size: 24px; line-height: 1; }
  .about-badge span:last-child { font-size: 10px; }

  .about-content { }

  .about-content h2 {
    font-size: clamp(24px, 3vw, 38px);
    font-weight: 800;
    color: white;
    margin-bottom: 20px;
    line-height: 1.3;
  }

  .about-content h2 span { color: var(--primary); }

  .about-content p {
    color: rgba(255,255,255,0.7);
    line-height: 1.9;
    margin-bottom: 15px;
    font-size: 15px;
  }

  .about-features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 30px;
  }

  .feature-item {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
  }

  .feature-icon {
    width: 36px;
    height: 36px;
    background: rgba(255,107,0,0.15);
    border: 1px solid rgba(255,107,0,0.3);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    color: var(--primary);
  }

  /* ===== SERVICES ===== */
  #services { background: var(--dark); }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 25px;
  }

  .service-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 30px 25px;
    border: 1px solid rgba(255,107,0,0.1);
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transform: scaleX(0);
    transition: transform 0.4s ease;
  }

  .service-card:hover::before { transform: scaleX(1); }

  .service-card:hover {
    transform: translateY(-8px);
    border-color: rgba(255,107,0,0.3);
    box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 30px rgba(255,107,0,0.1);
  }

  .service-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, rgba(255,107,0,0.2), rgba(233,69,96,0.2));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 20px;
    transition: all 0.3s;
  }

  .service-card:hover .service-icon {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    transform: scale(1.1) rotate(5deg);
  }

  .service-card h3 {
    font-size: 18px;
    font-weight: 700;
    color: white;
    margin-bottom: 8px;
  }

  .service-card .en-name {
    font-size: 11px;
    color: var(--primary);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .service-card p {
    font-size: 13px;
    color: var(--gray);
    line-height: 1.7;
    margin-bottom: 15px;
  }

  .service-price {
    color: var(--gold);
    font-weight: 700;
    font-size: 14px;
  }

  /* ===== GALLERY ===== */
  #gallery { background: var(--darker); }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: auto;
    gap: 15px;
  }

  .gallery-item {
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    background: var(--card-bg);
    border: 1px solid rgba(255,107,0,0.1);
    transition: all 0.4s;
  }

  .gallery-item:nth-child(1) { grid-column: span 2; grid-row: span 2; }
  .gallery-item:nth-child(5) { grid-column: span 2; }

  .gallery-visual {
    width: 100%;
    height: 100%;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .gallery-item:nth-child(1) .gallery-visual { min-height: 380px; }

  .gallery-bg {
    position: absolute;
    inset: 0;
    transition: transform 0.5s ease;
  }

  .gallery-item:hover .gallery-bg { transform: scale(1.1); }

  .gallery-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
  }

  .gallery-item:hover .gallery-overlay { opacity: 1; }
  .gallery-item:hover { transform: scale(1.02); border-color: rgba(255,107,0,0.4); }

  .gallery-overlay h4 { color: white; font-size: 16px; font-weight: 700; }
  .gallery-overlay p { color: rgba(255,255,255,0.7); font-size: 12px; }

  /* Gym scene visuals */
  .gym-scene {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    position: relative;
  }

  .gallery-item:nth-child(1) .gym-scene { font-size: 90px; }

  /* ===== BOOKING ===== */
  #booking { background: var(--dark); }

  .booking-wrapper {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 50px;
    align-items: start;
  }

  .booking-info h2 {
    font-size: clamp(22px, 3vw, 36px);
    font-weight: 800;
    color: white;
    margin-bottom: 15px;
  }

  .booking-info h2 span { color: var(--primary); }

  .booking-info p {
    color: var(--gray);
    line-height: 1.8;
    margin-bottom: 30px;
    font-size: 14px;
  }

  .booking-perks {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .perk {
    display: flex;
    align-items: center;
    gap: 15px;
    color: rgba(255,255,255,0.8);
    font-size: 14px;
  }

  .perk-icon {
    width: 40px;
    height: 40px;
    background: rgba(255,107,0,0.15);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    color: var(--primary);
  }

  .booking-form {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 40px;
    border: 1px solid rgba(255,107,0,0.15);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .form-group { margin-bottom: 20px; }

  .form-group label {
    display: block;
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 16px;
    color: white;
    font-size: 14px;
    transition: all 0.3s;
    font-family: inherit;
    direction: rtl;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255,107,0,0.1);
    background: rgba(255,107,0,0.05);
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder { color: var(--gray); }

  .form-group textarea { min-height: 100px; resize: vertical; }

  .form-group select option { background: var(--card-bg); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

  .form-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 10px;
    font-family: inherit;
  }

  .form-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(255,107,0,0.4);
  }

  .success-msg {
    display: none;
    background: rgba(0,200,100,0.1);
    border: 1px solid rgba(0,200,100,0.3);
    color: #00C864;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
  }

  .error-msg {
    color: var(--accent);
    font-size: 12px;
    margin-top: 5px;
    display: none;
  }

  .input-error { border-color: var(--accent) !important; }

  /* ===== PRICING ===== */

<script>
(function() {
  function revealAll() {
    document.querySelectorAll('.fade-in,.fade-in-left,.fade-in-right,[data-aos]').forEach(function(el){
      el.style.opacity='1'; el.style.transform='none'; el.classList.add('visible','aos-animate');
    });
  }
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('visible'); e.target.style.opacity='1'; e.target.style.transform='none'; }});
    },{threshold:0.1});
    document.querySelectorAll('.fade-in,.fade-in-left,.fade-in-right,[data-aos]').forEach(function(el){ obs.observe(el); });
  } else { revealAll(); }
  setTimeout(function(){
    document.querySelectorAll('.fade-in,.fade-in-left,.fade-in-right').forEach(function(el){
      var r=el.getBoundingClientRect(); if(r.top<window.innerHeight){ el.classList.add('visible'); el.style.opacity='1'; el.style.transform='none'; }
    });
  },100);
  var nav=document.querySelector('nav,#navbar,.navbar,header');
  if(nav) window.addEventListener('scroll',function(){ nav.classList.toggle('scrolled',window.scrollY>50); },{passive:true});
  document.querySelectorAll('a[href^="#"]').forEach(function(a){
    a.addEventListener('click',function(e){ var t=document.querySelector(this.getAttribute('href')); if(t){ e.preventDefault(); t.scrollIntoView({behavior:'smooth'}); }});
  });
  var hb=document.querySelector('.hamburger,.menu-toggle,#menu-btn,.nav-toggle');
  var mn=document.querySelector('.nav-links,.nav-menu,.mobile-menu,#nav-links');
  if(hb&&mn) hb.addEventListener('click',function(){ mn.classList.toggle('active'); this.classList.toggle('active'); });
  document.querySelectorAll('.faq-item,.accordion-item').forEach(function(item){
    var q=item.querySelector('.faq-question,.accordion-header,h3,h4');
    var a=item.querySelector('.faq-answer,.accordion-body,p');
    if(q&&a){ a.style.cssText='max-height:0;overflow:hidden;transition:max-height 0.35s ease'; q.style.cursor='pointer';
      q.addEventListener('click',function(){ var open=a.style.maxHeight!=='0px'&&a.style.maxHeight!=='0';
        document.querySelectorAll('.faq-item .faq-answer,.accordion-item .accordion-body').forEach(function(x){ x.style.maxHeight='0'; });
        document.querySelectorAll('.faq-item,.accordion-item').forEach(function(i){ i.classList.remove('active'); });
        if(!open){ a.style.maxHeight=a.scrollHeight+100+'px'; item.classList.add('active'); }
      });
    }
  });
  document.querySelectorAll('form').forEach(function(f){
    f.addEventListener('submit',function(e){ e.preventDefault();
      var b=f.querySelector('button[type=submit],input[type=submit]');
      if(b){ var o=b.textContent; b.textContent='✅ تم الإرسال!'; b.style.background='#00d4aa'; b.disabled=true;
        setTimeout(function(){ b.textContent=o; b.style.background=''; b.disabled=false; f.reset(); },3000); }
    });
  });
  setTimeout(revealAll,1500);
})();
</script>
